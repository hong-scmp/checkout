<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Subscription 3.0 Checkout Prototype - No Plan Summary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400&amp;family=Roboto+Condensed:wght@400;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --action-blue: #2c4692;
        --secondary-blue: #4585ff;
        --secondary-blue-100: #dae7ff;
        --primary-blue-50: #f1f3f9;
        --teal: #2aa191;
        --light-teal: #aad9d3;
        --red: #eb4254;
        --black: #000;
        --white: #fff;
        --grey-900: #333;
        --grey-700: #666;
        --grey-500: #888;
        --grey-400: #a1a1a1;
        --grey-250: #ccc;
        --grey-200: #dfdfdf;
        --bluegrey-100: #d3d4d6;
        --skeleton: #d9d9d9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--primary-blue-50);
        color: var(--black);
        font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .checkout {
        min-height: 100vh;
        background: var(--primary-blue-50);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .checkout.with-deal {
        background-image:
          linear-gradient(90deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.9)),
          linear-gradient(90deg, rgb(120, 138, 196), rgb(120, 138, 196));
      }

      .checkout.auth-mode {
        background: var(--white);
        padding-bottom: 0;
      }

      .checkout.auth-mode .header,
      .checkout.auth-mode .deal {
        display: none;
      }

      .checkout.auth-mode .shell {
        width: 100%;
        padding: 0;
        flex: 1;
      }

      .header {
        width: 100%;
        height: 56px;
        padding: 0 40px;
        background: var(--white);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .header-inner {
        width: 100%;
        max-width: 1088px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .brand {
        width: 207px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .brand-logo {
        display: block;
        width: 207px;
        height: 22px;
        object-fit: contain;
      }

      .brand-link {
        border: 0;
        background: transparent;
        padding: 0;
        cursor: pointer;
      }

      .brand-flag {
        width: 28px;
        height: 22px;
        border: 1px solid #d2d6e8;
        border-radius: 1px;
        background:
          linear-gradient(135deg, #fff 0 42%, #f6c145 42% 58%, #001246 58%),
          #fff;
      }

      .brand-wordmark {
        color: #001246;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 13px;
        line-height: 1;
        letter-spacing: 0;
        font-weight: 700;
        white-space: nowrap;
      }

      .deal {
        width: 100%;
        min-height: 40px;
        margin: 0;
        background: var(--secondary-blue-100);
        color: var(--action-blue);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px;
        border-radius: 0;
        font-size: 14px;
        line-height: 1.25;
      }

      .deal strong {
        font-weight: 700;
      }

      .deal span {
        font-weight: 400;
      }

      .deal-icon {
        width: 24px;
        height: 24px;
        display: block;
        flex: none;
      }

      .shell {
        width: min(100%, 656px);
        padding: 0 8px;
      }

      .checkout-footer {
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 16px 40px;
        color: #646971;
        font-size: 13px;
        line-height: 28px;
        pointer-events: none;
      }

      .checkout-footer.is-fixed {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
      }

      .checkout-footer-links {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 13px;
        width: 100%;
        max-width: 640px;
      }

      .checkout-footer a {
        color: inherit;
        text-decoration: none;
        pointer-events: auto;
      }

      .checkout-footer-separator {
        width: 1px;
        height: 14px;
        background: #d3d4d6;
        flex: none;
      }

      .checkout.with-deal .shell {
        padding-top: 24px;
      }

      .checkout-heading {
        width: 100%;
        max-width: 640px;
        margin: 0 auto 16px;
        padding: 0 16px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
      }

      .checkout-heading h1 {
        margin: 0;
        color: var(--black);
        font-family: Merriweather, Georgia, serif;
        font-size: 32px;
        font-weight: 400;
        line-height: 1.3;
      }

      .checkout-step-copy {
        margin: 0 0 8px;
        color: #7a7e85;
        font-size: 13px;
        line-height: 1.3;
        text-align: right;
      }

      .checkout-step-copy span {
        display: block;
        font-weight: 400;
      }

      .checkout-step-copy strong {
        display: block;
        font-weight: 700;
      }

      .plan {
        width: 100%;
        max-width: 640px;
        margin: 0 auto 8px;
        background: var(--white);
        border: 0;
        border-radius: 8px;
        padding: 16px;
      }

      .plan.plan-loading {
        display: grid;
        gap: 12px;
      }

      .plan-row,
      .pay-row,
      .section-head,
      .account-summary,
      .method-row,
      .field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .plan h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 28px;
        background: #788ac4;
        color: var(--white);
        padding: 4px 8px;
        font-size: 12px;
        line-height: 1;
        font-weight: 700;
        white-space: nowrap;
      }

      .badge.promo-badge {
        background: var(--secondary-blue);
      }

      .badge-expanded,
      .expanded-copy,
      .billing-close {
        display: none;
      }

      .plan.open .badge {
        background: #788ac4;
        border-radius: 20px;
      }

      .plan.open .collapsed-copy,
      .plan.open .billing-open {
        display: none;
      }

      .plan.open .expanded-copy,
      .plan.open .billing-close {
        display: inline;
      }

      .tag {
        width: 12px;
        height: 12px;
        border: 1.8px solid currentColor;
        transform: rotate(45deg);
        border-radius: 2px;
        display: inline-block;
      }

      .tag::after {
        content: "";
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: currentColor;
        position: absolute;
        margin: 2px 0 0 2px;
      }

      .tag-icon {
        width: 12px;
        height: 12px;
        display: block;
        flex: none;
      }

      .plan-copy {
        margin: 8px 0 0;
        color: var(--grey-900);
        font-size: 14px;
        line-height: 18px;
      }

      .billing {
        margin-top: 12px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 0;
        background: transparent;
        color: var(--action-blue);
        padding: 0;
        font-size: 12px;
      }

      .chev {
        width: 8px;
        height: 8px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(45deg);
        margin-top: -4px;
      }

      .billing-details {
        display: none;
        margin-top: 12px;
        color: var(--black);
        font-size: 12px;
        line-height: 18px;
      }

      .plan.open .billing-details {
        display: grid;
        gap: 8px;
      }

      .plan.open .chev {
        transform: rotate(225deg);
        margin-top: 4px;
      }

      .pay-row {
        margin-top: 16px;
        border-top: 1px solid var(--grey-200);
        padding-top: 16px;
        font-size: 14px;
      }

      .plan-skel-line {
        display: block;
        height: 18px;
        border-radius: 2px;
        background: linear-gradient(90deg, #d9d9d9, #ececec, #d9d9d9);
        background-size: 240% 100%;
        animation: shimmer 1.15s linear infinite;
      }

      .plan-skel-muted {
        background: linear-gradient(90deg, #d6dced, #edf1fb, #d6dced);
        background-size: 240% 100%;
      }

      .timeline-unit {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--grey-200);
        padding-top: 8px;
      }

      .timeline-copy {
        display: flex;
        min-width: 0;
        gap: 4px;
        padding-right: 12px;
      }

      .timeline-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1px solid var(--secondary-blue);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
        margin-top: 1px;
      }

      .timeline-dot::after {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--secondary-blue);
      }

      .timeline-dot.next {
        border-color: #788ac4;
      }

      .timeline-dot.next::after {
        background: #788ac4;
      }

      .timeline-dot-icon {
        width: 16px;
        height: 16px;
        display: block;
        flex: none;
        margin-top: 1px;
      }

      .timeline-title {
        margin: 0;
        font-size: 14px;
        line-height: 18px;
      }

      .timeline-subtitle {
        margin: 0;
        color: var(--grey-700);
        font-size: 12px;
        line-height: 18px;
      }

      .timeline-subtitle.offer {
        color: var(--secondary-blue);
      }

      .timeline-price {
        flex: none;
        text-align: right;
        white-space: nowrap;
      }

      .timeline-price p {
        margin: 0;
        font-size: 14px;
        line-height: 18px;
      }

      .timeline-price s {
        display: block;
        color: var(--grey-700);
        font-size: 12px;
        line-height: 18px;
      }

      .pay-row s {
        color: var(--grey-500);
        margin-right: 4px;
      }

      .flow {
        max-width: 640px;
        margin: 0 auto;
        border: 0;
        border-radius: 8px;
        overflow: hidden;
        background: transparent;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .panel {
        background: var(--white);
        border-bottom: 0;
        border-radius: 8px;
        padding: 16px;
      }

      .panel.expanded {
        padding-bottom: 40px;
      }

      .step-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 18px;
        line-height: 1.2;
        font-weight: 700;
        color: var(--black);
      }

      .step-no {
        width: 24px;
        height: 24px;
        border-radius: 32px;
        background: var(--black);
        color: var(--white);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        line-height: 1;
        font-weight: 700;
      }

      .step-no.done {
        display: none;
      }

      .step-check-icon {
        width: 24px;
        height: 24px;
        display: block;
        flex: none;
      }

      .section-head.disabled .step-no {
        background: var(--grey-400);
      }

      .section-head.disabled .step-title {
        color: var(--grey-400);
      }

      .section-head.disabled .step-label {
        color: var(--grey-400);
      }

      .completed-copy {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .step-label {
        color: var(--black);
        font-size: 18px;
        font-weight: 700;
        line-height: 1.2;
        white-space: nowrap;
      }

      .completed-email {
        color: var(--grey-500);
        font-size: 16px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .payment-method-label {
        color: var(--grey-500);
        font-size: 16px;
        font-weight: 400;
        white-space: nowrap;
      }

      .link-button {
        border: 0;
        background: transparent;
        color: var(--action-blue);
        text-decoration: underline;
        padding: 0;
        font-size: 14px;
      }

      .card-body {
        margin-top: 24px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .card-title {
        margin: 0;
        width: 100%;
        text-align: center;
        font-size: 22px;
        line-height: 1.2;
      }

      .card-subtitle {
        margin: -8px 0 0;
        width: 100%;
        text-align: center;
        color: var(--grey-700);
        font-size: 14px;
        line-height: 1.25;
      }

      .forgot-body {
        margin-top: 24px;
        padding-bottom: 24px;
        gap: 24px;
      }

      .card-body.short-content {
        min-height: 360px;
        justify-content: center;
        padding-bottom: 16px;
      }

      .payment-review-body {
        gap: 24px;
      }

      .forgot-message {
        width: 100%;
        display: grid;
        justify-items: center;
        gap: 16px;
      }

      .forgot-icon {
        width: 48px;
        height: 48px;
        display: block;
      }

      .forgot-title {
        margin: 0;
        width: 100%;
        color: var(--black);
        font-family: Roboto, Arial, sans-serif;
        font-size: 22px;
        font-weight: 700;
        line-height: 1.2;
        text-align: center;
      }

      .forgot-copy {
        margin: 0;
        max-width: 470px;
        color: var(--grey-700);
        font-size: 14px;
        line-height: 1.25;
        text-align: center;
      }

      .forgot-copy strong {
        color: var(--grey-900);
        font-weight: 700;
      }

      .forgot-copy + .forgot-copy {
        margin-top: 8px;
      }

      .forgot-send {
        font-weight: 700;
      }

      .form-width {
        width: 100%;
        max-width: 360px;
        display: grid;
        gap: 8px;
      }

      .social {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--grey-250);
        border-radius: 8px;
        background: var(--white);
        color: var(--grey-700);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        position: relative;
        padding: 12px 16px;
        font-size: 14px;
        line-height: 1.2;
        transition: background-color 0.16s ease, border-color 0.16s ease;
      }

      .social:hover {
        background: #f4f4f4;
      }

      .social-row {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      .social-stack {
        width: 100%;
        display: grid;
        gap: 8px;
      }

      .social-full {
        min-height: 48px;
        border-color: var(--grey-250);
        color: var(--grey-700);
        font-size: 14px;
      }

      .social-full .asset-icon {
        width: 24px;
        height: 24px;
      }

      .linked-social-copy {
        width: 100%;
        display: grid;
        gap: 8px;
        text-align: center;
      }

      .linked-social-copy .card-title,
      .linked-social-copy .card-subtitle {
        margin: 0;
      }

      .linked-social-field {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .linked-social-button {
        width: 100%;
        max-width: 360px;
        min-height: 48px;
        border: 1px solid var(--grey-250);
        border-radius: 8px;
        background: var(--black);
        color: var(--white);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 16px;
        font-family: "Roboto Condensed", Roboto, Arial, sans-serif;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.2;
        text-transform: uppercase;
        transition: background-color 0.16s ease, border-color 0.16s ease;
      }

      .linked-social-button:hover {
        background: var(--grey-900);
      }

      .linked-social-button .asset-icon {
        width: 22px;
        height: 22px;
      }

      .last-used {
        display: none;
        position: absolute;
        top: 3px;
        right: 3px;
        border-radius: 4px;
        background: var(--grey-200);
        color: var(--black);
        padding: 2px 4px;
        font-size: 12px;
        line-height: 1.25;
        font-weight: 700;
      }

      .social-icon-only {
        flex: 1 1 0;
        min-height: 48px;
        padding: 11px 16px;
        border-color: var(--grey-400);
      }

      .social-auth-page {
        min-height: 100vh;
        width: 100%;
        color: #202124;
      }

      .social-account-choice {
        width: 100%;
        border: 1px solid #dadce0;
        border-radius: 12px;
        background: var(--white);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .social-account-choice:hover {
        background: #f8fafd;
        border-color: #c2d3f7;
      }

      .social-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #a142f4;
        color: var(--white);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        flex: none;
      }

      .social-account-copy {
        display: grid;
        gap: 2px;
        min-width: 0;
      }

      .social-account-copy strong {
        font-size: 15px;
        color: #202124;
      }

      .social-account-copy span {
        color: var(--grey-700);
        font-size: 13px;
      }

      .social-auth-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 16px;
      }

      .social-auth-primary {
        min-width: 96px;
        border: 0;
        border-radius: 24px;
        background: #2f5fd6;
        color: var(--white);
        padding: 12px 24px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.16s ease;
      }

      .social-auth-primary:hover {
        background: #788ac4;
      }

      .social-auth-secondary {
        border: 0;
        background: transparent;
        color: #2f5fd6;
        padding: 12px;
        font-size: 16px;
        cursor: pointer;
      }

      .social-auth-provider-icon {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }

      .social-auth-page.google {
        background: #eef3fb;
        display: grid;
        align-items: center;
        padding: 42px 24px;
      }

      .social-google-window {
        width: min(100%, 1180px);
        margin: 0 auto;
      }

      .social-google-header {
        min-height: 56px;
        border-bottom: 1px solid #dadce0;
        border-radius: 30px 30px 0 0;
        background: var(--white);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 28px;
        font-weight: 500;
        color: #3c4043;
      }

      .social-google-card {
        min-height: 390px;
        border-radius: 0 0 30px 30px;
        background: var(--white);
        padding: 68px 40px 34px;
        display: grid;
        grid-template-columns: 1fr 1.15fr;
        gap: 72px;
      }

      .social-google-title {
        margin: 0;
        font-size: 44px;
        line-height: 1.05;
        font-weight: 400;
        letter-spacing: 0;
      }

      .social-google-copy p {
        margin: 28px 0 0;
        font-size: 18px;
        line-height: 1.4;
      }

      .social-google-copy strong {
        color: #2f5fd6;
        font-weight: 600;
      }

      .social-google-panel {
        display: grid;
        align-content: start;
        gap: 20px;
      }

      .social-google-panel .social-account-choice {
        border-radius: 8px;
        padding: 16px;
      }

      .social-alt-action {
        width: 100%;
        border: 0;
        background: transparent;
        color: #2f5fd6;
        padding: 10px 4px;
        text-align: left;
        font-size: 15px;
        font-weight: 500;
      }

      .social-google-note {
        margin: 18px 0 0;
        color: #5f6368;
        font-size: 14px;
        line-height: 1.45;
      }

      .social-google-actions {
        align-self: end;
        grid-column: 1 / -1;
      }

      .social-google-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px 18px 0;
        color: #3c4043;
        font-size: 14px;
      }

      .social-footer-links {
        display: flex;
        align-items: center;
        gap: 28px;
      }

      .social-auth-page.apple {
        background: var(--white);
        display: flex;
        flex-direction: column;
      }

      .social-apple-header {
        width: min(100%, 1120px);
        margin: 0 auto;
        padding: 28px 24px 20px;
        border-bottom: 1px solid #d2d2d7;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #1d1d1f;
      }

      .social-apple-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 22px;
        font-weight: 700;

        max-width: 544px;
        margin: 0 auto;
        border: 0;
        background: transparent;
        color: var(--action-blue);
        padding: 0;
        text-align: left;
        font-size: 14px;
        text-decoration: underline;
      }

      .promo-form {
        display: grid;
        gap: 8px;
        width: 100%;
        max-width: 544px;
        margin: 0 auto;
      }

      .promo-entry {
        display: flex;
        align-items: stretch;
        gap: 8px;
        width: 100%;
      }

      .promo-input {
        flex: 1 1 auto;
        min-width: 0;
        height: 43px;
        border: 1px solid var(--grey-200);
        border-radius: 2px;
        padding: 11px;
        color: var(--black);
        font-size: 14px;
      }

      .promo-input:focus {
        border-color: var(--black);
        outline: 0;
      }

      .promo-input.error {
        border: 2px solid var(--red);
        padding: 10px;
      }

      .promo-apply {
        min-width: 74px;
        height: 43px;
        border: 0;
        border-radius: 8px;
        background: var(--action-blue);
        color: var(--white);
        padding: 12px 16px;
        font-family: "Roboto Condensed", Roboto, Arial, sans-serif;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.2;
        text-transform: uppercase;
        transition: background-color 0.16s ease;
      }

      .promo-apply:disabled {
        background: var(--grey-400);
      }

      .promo-apply:not(:disabled):hover {
        background: #788ac4;
      }

      .promo-error {
        margin: 0;
        color: var(--red);
        font-size: 12px;
      }

      .promo-applied {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        border: 1px solid var(--light-teal);
        border-radius: 4px;
        background: rgba(170, 217, 211, 0.3);
        padding: 12px 8px;
      }

      .promo-applied-code {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--teal);
        font-family: "Roboto Condensed", Roboto, Arial, sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .promo-tick {
        width: 10px;
        height: 6px;
        border-left: 2px solid var(--teal);
        border-bottom: 2px solid var(--teal);
        transform: rotate(-45deg);
        margin-top: -2px;
      }

      .promo-remove {
        width: 20px;
        height: 20px;
        display: inline-grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--white);
        transition: background-color 0.16s ease;
      }

      .promo-remove:hover {
        background: #f4f4f4;
      }

      .promo-remove-icon {
        width: 12px;
        height: 12px;
        display: block;
      }

      .promo-saving {
        margin: 0;
        color: var(--teal);
        font-size: 12px;
      }

      .promo-loading {
        margin: 0;
        color: var(--grey-700);
        font-size: 12px;
      }

      .purchase {
        display: grid;
        gap: 16px;
        width: 100%;
        max-width: 544px;
        margin: 0 auto;
      }

      .purchase .cta {
        max-width: 360px;
        justify-self: center;
      }

      .purchase .terms {
        font-size: 12px;
        line-height: 1.25;
      }

      .renewal {
        margin: 0;
        font-size: 14px;
        line-height: 20px;
      }

      .renewal strong {
        font-weight: 400;
      }

      .renewal .teal {
        color: var(--teal);
        font-style: italic;
        font-weight: 700;
      }

      .success-card {
        width: 100%;
        max-width: 640px;
        margin: 24px auto 0;
        background: var(--white);
        border: 0;
        border-radius: 8px 8px 0 0;
        padding: 40px 32px;
        text-align: center;
      }

      .success-icon {
        width: 48px;
        height: 48px;
        border: 3px solid #788ac4;
        border-radius: 50%;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .success-icon::after {
        content: "";
        width: 22px;
        height: 12px;
        border-left: 3px solid #788ac4;
        border-bottom: 3px solid #788ac4;
        transform: rotate(-45deg);
        margin-top: -6px;
      }

      .success-card h2 {
        margin: 0;
        font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 24px;
        font-weight: 700;
      }

      .success-copy {
        max-width: 390px;
        margin: 8px auto 0;
        color: var(--grey-700);
        font-size: 16px;
        line-height: 1.25;
      }

      .receipt {
        width: 100%;
        max-width: 360px;
        margin: 32px auto 0;
        padding: 16px;
        border-radius: 8px;
        background: var(--primary-blue-50);
        text-align: left;
      }

      .receipt-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid #d6dced;
        color: #30343c;
        font-size: 14px;
        line-height: 1.25;
      }

      .receipt-row + .receipt-row {
        margin-top: 16px;
      }

      .receipt-row:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .receipt-row strong {
        text-align: right;
      }

      .receipt-note {
        margin: 8px auto 0;
        max-width: 390px;
        color: var(--grey-700);
        font-size: 14px;
        line-height: 1.25;
        text-align: center;
      }

      .success-cta {
        max-width: 360px;
        margin: 32px auto 0;
      }

      .payment-loading-page {
        width: 100%;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        background: var(--white);
      }

      .payment-loading-content {
        display: grid;
        justify-items: center;
        gap: 24px;
      }

      .payment-loading-logo {
        margin-bottom: 8px;
      }

      .payment-loading-title {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        line-height: 1.2;
      }

      .payment-loading-copy {
        margin: -8px 0 8px;
        color: var(--grey-700);
        font-size: 18px;
        line-height: 1.25;
      }

      .skeleton-area {
        display: grid;
        gap: 24px;
        width: 100%;
        max-width: 544px;
        margin: 0 auto;
      }

      .account-loading-panel {
        min-height: 300px;
        display: flex;
        flex-direction: column;
      }

      .account-loading-center {
        flex: 1;
        display: grid;
        align-items: center;
        justify-content: center;
        justify-items: center;
        min-height: 360px;
        width: 100%;
        padding: 0 0 16px;
      }

      .account-loading-content {
        display: grid;
        justify-items: center;
        gap: 16px;
        text-align: center;
      }

      .account-loading-content .account-loading-spinner {
        margin-top: 0;
      }

      .loading-title {
        margin: 0;
        color: var(--black);
        font-family: Roboto, Arial, sans-serif;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.25;
      }

      .loading-copy {
        margin: 0;
        color: var(--grey-700);
        font-size: 14px;
        line-height: 1.25;
      }

      .account-loading-spinner {
        width: 40px;
        height: 40px;
        margin-top: 14px;
        border-radius: 50%;
        border: 3px solid #e2e4ea;
        border-top-color: var(--action-blue);
        animation: spin 0.9s linear infinite;
      }

      .skel {
        display: block;
        background: linear-gradient(90deg, #d9d9d9, #ececec, #d9d9d9);
        background-size: 240% 100%;
        border-radius: 2px;
        animation: shimmer 1.15s linear infinite;
      }

      .skel.line {
        height: 14px;
        width: 132px;
      }

      .skel.long {
        width: 100%;
        height: 13px;
      }

      .skel.input {
        width: 100%;
        height: 48px;
        border-radius: 2px;
      }

      .skel.btn {
        height: 48px;
        width: 100%;
        border-radius: 4px;
      }

      @keyframes shimmer {
        to {
          background-position: -240% 0;
        }
      }

      @keyframes dotPulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }

        40% {
          opacity: 1;
        }
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 600px) {
        .header {
          padding-inline: 16px;
        }

        .brand,
        .brand-logo {
          width: 207px;
          max-width: calc(100vw - 120px);
        }

        .shell {
          width: 100%;
          padding: 0 16px;
        }

        .checkout.with-deal .shell {
          padding-top: 16px;
        }

        .deal {
          justify-content: flex-start;
          gap: 12px;
          padding: 16px;
          font-size: 14px;
          line-height: 1.25;
          text-align: left;
        }

        .deal span {
          flex: 1;
          min-width: 0;
          max-width: 100%;
        }

        .deal-icon {
          margin-top: 0;
        }

        .plan,
        .flow,
        .success-card,
        .checkout-heading {
          max-width: none;
        }

        .checkout-heading h1 {
          font-size: 28px;
        }

        .checkout-step-copy {
          margin-bottom: 6px;
          font-size: 12px;
        }

        .checkout-footer {
          padding-inline: 16px;
        }

        .checkout-footer-links {
          gap: 8px;
          font-size: 12px;
          white-space: nowrap;
        }

        .payment-loading-title {
          font-size: 24px;
        }

        .payment-loading-copy {
          font-size: 16px;
        }

        .plan {
          box-shadow: none;
        }

        .completed-email {
          max-width: 128px;
        }

        .payment-method-label {
          max-width: 96px;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .alipay-desktop-only {
          display: none;
        }

        .alipay-mobile-cta {
          display: flex;
        }

        .alipay-handoff {
          gap: 16px;
        }

        .field-grid {
          grid-template-columns: 1fr 1fr;
        }

        .badge {
          font-size: 11px;
        }

        .deal {
          justify-content: center;
        }

        .social-auth-page.google {
          padding: 16px;
          align-items: start;
        }

        .social-google-header {
          border-radius: 22px 22px 0 0;
          padding-inline: 20px;
        }

        .social-google-card {
          grid-template-columns: 1fr;
          gap: 28px;
          padding: 34px 20px 24px;
          border-radius: 0 0 22px 22px;
        }

        .social-google-title {
          font-size: 34px;
        }

        .social-google-actions,
        .social-auth-actions {
          justify-content: space-between;
        }

        .social-google-footer {
          align-items: flex-start;
          gap: 16px;
          flex-direction: column;
        }

        .social-apple-main {
          padding-top: 56px;
        }

        .social-facebook-layout {
          grid-template-columns: 1fr;
          min-height: auto;
        }

        .social-facebook-promo {
          border-right: 0;
          border-bottom: 1px solid #dddfe2;
          padding: 32px 28px;
          gap: 48px;
        }

        .social-facebook-panel {
          padding: 42px 24px;
        }

        .social-facebook-gear {
          top: 32px;
          right: 24px;
        }

        .social-facebook-avatar {
          width: 136px;
          height: 136px;
        }

        .social-facebook-name {
          font-size: 26px;
        }

        .social-facebook-create {
          margin-top: 36px;
        }
      }
    </style>
  </head>
  <body>
    <main class="checkout" id="checkout">
      <header class="header" id="pageHeader"></header>

      <div class="deal hidden" id="deal">
        <img class="deal-icon" src="assets/subscription-checkout/check-circle-2.svg" alt="" />
        <span>You're subscribing to <strong>Standard: Annual</strong> - just two more steps to go.</span>
      </div>

      <section class="shell" id="shell">
        <div class="checkout-heading" id="checkoutHeading"></div>
        <section class="flow" id="flow" aria-live="polite"></section>
      </section>

      <footer class="checkout-footer hidden" id="checkoutFooter">
        <nav class="checkout-footer-links" aria-label="Checkout footer">
          <a href="#">Subscription FAQ</a>
          <span class="checkout-footer-separator" aria-hidden="true"></span>
          <a href="#">Privacy &amp; Policy</a>
          <span class="checkout-footer-separator" aria-hidden="true"></span>
          <a href="#">Terms &amp; Conditions</a>
        </nav>
      </footer>
    </main>

    <script>
      const state = {
        screen: "account",
        email: "",
        invalidEmail: false,
        password: "",
        passwordVisible: false,
        socialProvider: "",
        paymentProvider: "",
        addNewCard: false,
        cardComplete: false,
        residenceCountry: "Hong Kong SAR",
        billingSameCountry: true,
        billingCountry: "",
        openCountryMenu: "",
        planExpanded: false,
        initialPlanLoading: false,
        promoPlanLoading: false,
        promoDiscountApplied: false,
        promoOpen: false,
        promoCode: "",
        promoStatus: "",
        terms: false,
        appleTerms: false,
      };

      const flow = document.querySelector("#flow");
      const checkout = document.querySelector("#checkout");
      const pageHeader = document.querySelector("#pageHeader");
      const deal = document.querySelector("#deal");
      const shell = document.querySelector("#shell");
      const checkoutFooter = document.querySelector("#checkoutFooter");
      const assetPath = "assets/subscription-checkout/";
      const asset = (name) => `${assetPath}${name}`;
      const CHECKOUT_LOADING_DELAY = 3000;
      const countries = [
        "Hong Kong SAR",
        "Singapore",
        "United States",
        "United Kingdom",
        "Australia",
        "Canada",
        "Japan",
        "Taiwan",
        "Macau SAR",
      ];

      function isValidEmail(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim());
      }

      function setScreen(screen, patch = {}) {
        Object.assign(state, patch, { screen });
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function updateState(patch = {}) {
        Object.assign(state, patch);
        render();
      }

      function showAccountLoadingThen(screen, patch = {}) {
        setScreen("accountLoading");
        setTimeout(() => {
          if (state.screen === "accountLoading") setScreen(screen, patch);
        }, CHECKOUT_LOADING_DELAY);
      }

      function updateFooterVisibility() {
        if (!checkoutFooter) return;
        const authMode = ["socialAuth", "socialLoading", "paymentLoading"].includes(state.screen);
        if (authMode) {
          checkoutFooter.classList.add("hidden");
          checkoutFooter.classList.remove("is-fixed");
          return;
        }
        checkoutFooter.classList.remove("hidden");
        checkoutFooter.classList.remove("is-fixed");
        const footerHeight = checkoutFooter.getBoundingClientRect().height || 60;
        const visibleChrome = [pageHeader, deal, shell].filter((node) => {
          return node && getComputedStyle(node).display !== "none";
        });
        const contentBottom = visibleChrome.reduce((bottom, node) => {
          return Math.max(bottom, node.getBoundingClientRect().bottom);
        }, 0);
        const canDock = contentBottom + footerHeight <= window.innerHeight;
        checkoutFooter.classList.toggle("is-fixed", canDock);
      }

      function scheduleFooterVisibility() {
        requestAnimationFrame(updateFooterVisibility);
      }

      function updateDealMessage(isPaymentStep) {
        const stepsCopy = isPaymentStep ? "one more step" : "two more steps";
        deal.innerHTML = `
          <img class="deal-icon" src="${asset("check-circle-2.svg")}" alt="" />
          <span>You're subscribing to <strong>Standard: Annual</strong> - just ${stepsCopy} to go.</span>
        `;
      }

      function headerMarkup() {
        return `
          <div class="header-inner">
            <button type="button" class="brand brand-link" data-action="reset-flow" aria-label="South China Morning Post - reset checkout">
              <img class="brand-logo" src="${asset("SouthChinaMorningPost-logo.svg")}" alt="South China Morning Post" />
            </button>
          </div>
        `;
      }

      function checkoutHeadingMarkup() {
        const isPaymentStep = ["paymentMethod", "creditLoading", "credit", "appleLoading", "apple"].includes(state.screen);
        const stepNumber = isPaymentStep ? "2" : "1";
        const stepLabel = isPaymentStep ? "Payment" : "Create account or log in";

        return `
          <div class="checkout-heading" id="checkoutHeading">
            <h1>Checkout</h1>
            <p class="checkout-step-copy">
              <span>Step ${stepNumber} of 2</span>
              <strong>${stepLabel}</strong>
            </p>
          </div>
        `;
      }

      function standardShellMarkup() {
        return `
          ${checkoutHeadingMarkup()}
          <section class="flow" id="flow" aria-live="polite"></section>
        `;
      }

      function stepHeader(number, title, options = {}) {
        const done = options.done ? " done" : "";
        const disabled = options.disabled ? " disabled" : "";
        const stepMark = options.done
          ? `<img class="step-check-icon" src="${asset("step-no..svg")}" alt="" />`
          : `<span class="step-no${done}">${number}</span>`;
        const email = options.email
          ? `<span class="completed-email">${state.email || "abc@abc.com"}</span>`
          : "";
        const method = options.method
          ? `<span class="payment-method-label">${options.method}</span>`
          : "";
        const changeAction = options.action || "edit-account";
        const change = options.change
          ? `<button type="button" class="link-button" data-action="${changeAction}">${options.change}</button>`
          : "";
        return `
          <div class="section-head${disabled}">
            <div class="${options.done ? "completed-copy" : "step-title"}">
              ${stepMark}
              <span class="step-label">${title}</span>
              ${email}
              ${method}
            </div>
            ${change}
          </div>
        `;
      }

      function accountPanel() {
        const emailValue = state.email;
        const invalidClass = state.invalidEmail ? " invalid" : "";
        const error = state.invalidEmail
          ? `<span class="error">Please enter a valid email address</span>`
          : "";
        const buttonDisabled = !emailValue.trim() ? "disabled" : "";
        return `
          <section class="panel expanded">
            ${stepHeader(1, "Account")}
            <div class="card-body">
              <h2 class="card-title">Start your subscription</h2>
              <p class="card-subtitle">New or returning? Either way, start here.</p>
              <div class="form-width">
                <div class="social-stack" aria-label="Social sign in options">
                  <button type="button" class="social social-full" data-action="social-login" data-provider="google">
                    <img class="asset-icon google" src="${asset("icon_google.svg")}" alt="" />
                    <span>Continue with Google</span>
                    <span class="last-used">Last used</span>
                  </button>
                  <button type="button" class="social social-full" data-action="social-login" data-provider="apple">
                    <img class="asset-icon apple" src="${asset("icon-apple.svg")}" alt="" />
                    <span>Continue with Apple</span>
                  </button>
                  <button type="button" class="social social-full" data-action="social-login" data-provider="facebook">
                    <img class="asset-icon facebook" src="${asset("icon_fb.svg")}" alt="" />
                    <span>Continue with Facebook</span>
                  </button>
                </div>
                <div class="separator">or</div>
                <div class="field-wrap">
                  <label class="field${invalidClass}" aria-label="Email address">
                    <input id="emailInput" type="text" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" dir="ltr" placeholder="Enter your email" value="${emailValue}" />
                    ${isValidEmail(emailValue) ? '<span class="tick-small" aria-hidden="true"></span>' : ""}
                  </label>
                  ${error}
                </div>
                <button type="button" class="cta" data-action="continue-email" ${buttonDisabled}>Continue with email</button>
              </div>
              <p class="fineprint">
                By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
              </p>
            </div>
          </section>
          <section class="panel">
            ${stepHeader(2, "Payment", { disabled: true })}
          </section>
        `;
      }

      function passwordPanel() {
        const canLogin = state.password.length > 0;
        const passwordType = state.passwordVisible ? "text" : "password";
        const passwordIcon = state.passwordVisible ? "eye-off.svg" : "password_eye.svg";
        const passwordLabel = state.passwordVisible ? "Hide password" : "Show password";
        return `
          <section class="panel expanded">
            ${stepHeader(1, "Account")}
            <div class="card-body short-content">
              <h2 class="card-title">We found your account</h2>
              <p class="card-subtitle">Sign in to continue with your subscription</p>
              <div class="form-width" style="gap:24px">
                <div class="field-wrap" style="gap:8px">
                  <div class="field">
                    <span>${state.email || "abc@abc.com"}</span>
                    <button type="button" class="field-link" data-action="edit-account">Change</button>
                  </div>
                  <div class="field" aria-label="Password">
                    <input id="passwordInput" type="${passwordType}" placeholder="Password" value="${state.password}" />
                    <button type="button" class="password-toggle" data-action="toggle-password" aria-label="${passwordLabel}">
                      <img src="${asset(passwordIcon)}" alt="" />
                    </button>
                  </div>
                  <button type="button" class="link-button password-forgot" data-action="forgot">Forgot your password?</button>
                </div>
                <button type="button" class="cta" data-action="login" ${canLogin ? "" : "disabled"}>Log in</button>
              </div>
            </div>
          </section>
          <section class="panel">
            ${stepHeader(2, "Payment", { disabled: true })}
          </section>
        `;
      }

      function linkedGooglePanel() {
        const accountEmail = state.email || "abc@gmail.com";
        return `
          <section class="panel expanded">
            ${stepHeader(1, "Account")}
            <div class="card-body short-content">
              <div class="linked-social-copy">
                <h2 class="card-title">You already have an account</h2>
                <p class="card-subtitle">This email is linked to Google. Sign in with Google to continue.</p>
              </div>
              <div class="form-width" style="gap:24px">
                <div class="field linked-social-field">
                  <span>${accountEmail}</span>
                  <button type="button" class="field-link" data-action="edit-account">Change</button>
                </div>
              </div>
              <button type="button" class="linked-social-button" data-action="linked-google">
                <img class="asset-icon google" src="${asset("icon_google.svg")}" alt="" />
                <span>Continue with Google</span>
              </button>
            </div>
          </section>
          <section class="panel">
            ${stepHeader(2, "Payment", { disabled: true })}
          </section>
        `;
      }

      function accountLoadingPanel() {
        return `
          <section class="panel expanded account-loading-panel">
            ${stepHeader(1, "Account")}
            <div class="account-loading-center" role="status" aria-live="polite" aria-label="Checking account status">
              <div class="account-loading-content">
                <span class="account-loading-spinner" aria-hidden="true"></span>
              </div>
            </div>

      function render() {
        const authMode = ["socialAuth", "socialLoading", "paymentLoading"].includes(state.screen);
        const dealScreens = ["account", "password", "linkedGoogle", "accountLoading", "forgot", "paymentMethod", "creditLoading", "credit", "apple", "appleLoading"];
        const paymentStepScreens = ["paymentMethod", "creditLoading", "credit", "apple", "appleLoading"];
        pageHeader.innerHTML = headerMarkup();
        updateDealMessage(paymentStepScreens.includes(state.screen));
        checkout.classList.toggle("auth-mode", authMode);
        checkout.classList.toggle("with-deal", !authMode && dealScreens.includes(state.screen));
        deal.classList.toggle("hidden", authMode || !dealScreens.includes(state.screen));

        if (state.screen === "socialAuth") {
          shell.innerHTML = socialAuthPanel();
          scheduleFooterVisibility();
          return;
        }

        if (state.screen === "socialLoading") {
          shell.innerHTML = socialLoadingPanel();
          scheduleFooterVisibility();
          return;
        }

        if (state.screen === "paymentLoading") {
          shell.innerHTML = paymentLoadingPanel();
          scheduleFooterVisibility();
          return;
        }

        if (state.screen === "success") {
          successPanel();
          scheduleFooterVisibility();
          return;
        }

        if (state.screen === "already") {
          alreadySubscribed();
          scheduleFooterVisibility();
          return;
        }

        if (!document.querySelector("#flow") || !document.querySelector("#checkoutHeading")) {
          shell.innerHTML = standardShellMarkup();
        } else {
          document.querySelector("#checkoutHeading").outerHTML = checkoutHeadingMarkup();
        }

        const target = document.querySelector("#flow");
        if (state.screen === "password") target.innerHTML = passwordPanel();
        else if (state.screen === "linkedGoogle") target.innerHTML = linkedGooglePanel();
        else if (state.screen === "accountLoading") target.innerHTML = accountLoadingPanel();
        else if (state.screen === "forgot") target.innerHTML = forgotPanel();
        else if (state.screen === "paymentMethod") target.innerHTML = paymentMethodPanel();
        else if (state.screen === "creditLoading") target.innerHTML = creditSkeleton();
        else if (state.screen === "credit") target.innerHTML = creditPanel();
        else if (state.screen === "appleLoading") target.innerHTML = appleSkeleton();
        else if (state.screen === "apple") target.innerHTML = applePanel();
        else target.innerHTML = accountPanel();
        scheduleFooterVisibility();
      }

      window.addEventListener("resize", scheduleFooterVisibility);

      document.addEventListener("input", (event) => {
        if (event.target.id === "emailInput") {
          state.email = event.target.value;
          state.invalidEmail = false;
          const field = event.target.closest(".field");
          const error = field?.parentElement?.querySelector(".error");
          const tick = field?.querySelector(".tick-small");
          const continueButton = document.querySelector('[data-action="continue-email"]');
          field?.classList.remove("invalid");
          error?.remove();
          if (continueButton) continueButton.disabled = !state.email.trim();
          if (isValidEmail(state.email) && !tick) {
            field?.insertAdjacentHTML("beforeend", '<span class="tick-small" aria-hidden="true"></span>');
          }
          if (!isValidEmail(state.email)) {
            tick?.remove();
          }
        }
        if (event.target.id === "passwordInput") {
          state.password = event.target.value;
          const loginButton = document.querySelector('[data-action="login"]');
          if (loginButton) loginButton.disabled = state.password.length === 0;
        }
        if (event.target.id === "promoInput") {
          state.promoCode = event.target.value.toUpperCase();
          state.promoStatus = "";
          const applyButton = document.querySelector('[data-action="apply-promo"]');
          if (applyButton) applyButton.disabled = !state.promoCode.trim();
          event.target.value = state.promoCode;
          event.target.classList.remove("error");
          document.querySelector(".promo-error")?.remove();
        }
        if (["cardInput", "expiryInput", "cvvInput"].includes(event.target.id)) {
          state.cardComplete = true;
          render();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.target.id === "emailInput" && event.key === "Enter") {
          event.preventDefault();
          document.querySelector('[data-action="continue-email"]')?.click();
        }
        if (event.target.id === "promoInput" && event.key === "Enter") {
          event.preventDefault();
          document.querySelector('[data-action="apply-promo"]')?.click();
        }
      });

      document.addEventListener("change", (event) => {
        if (event.target.id === "termsInput") {
          state.terms = event.target.checked;
          render();
        }
        if (event.target.id === "appleTermsInput") {
          state.appleTerms = event.target.checked;
          render();
        }
        if (event.target.id === "billingSameInput") {
          state.billingSameCountry = event.target.checked;
          state.openCountryMenu = "";
          if (state.billingSameCountry) state.billingCountry = "";
          render();
        }
      });

      document.addEventListener("click", (event) => {
        const actionTarget = event.target.closest("[data-action]");
        if (!actionTarget) return;
        const action = actionTarget.dataset.action;
        event.preventDefault();

        if (action === "continue-email") {
          if (!isValidEmail(state.email)) {
            setScreen("account", { invalidEmail: true });
          } else if (state.email.toLowerCase() === "subscriber@scmp.com") {
            showAccountLoadingThen("already");
          } else if (state.email.toLowerCase() === "abc@abc.com") {
            showAccountLoadingThen("password");
          } else if (state.email.toLowerCase() === "abc@gmail.com") {
            showAccountLoadingThen("linkedGoogle");
          } else {
            showAccountLoadingThen("paymentMethod");
          }
        }
        if (action === "social-login") setScreen("socialAuth", { socialProvider: actionTarget.dataset.provider || "google" });
        if (action === "linked-google") setScreen("socialAuth", { socialProvider: "google" });
        if (action === "social-back") setScreen("account");
        if (action === "social-account-continue") {
          setScreen("socialLoading", { email: "abc@abc.com" });
          setTimeout(() => {
            if (state.screen === "socialLoading") setScreen("paymentMethod");
          }, CHECKOUT_LOADING_DELAY);
        }
        if (action === "edit-account") setScreen("account", { email: "", password: "", passwordVisible: false, invalidEmail: false });
        if (action === "change-payment") setScreen("paymentMethod");
        if (action === "forgot") showAccountLoadingThen("forgot");
        if (action === "back-password") setScreen("password");
        if (action === "toggle-password") setScreen("password", { passwordVisible: !state.passwordVisible });
        if (action === "login") showAccountLoadingThen("paymentMethod");
        if (action === "toggle-country") {
          state.openCountryMenu = state.openCountryMenu === actionTarget.dataset.target ? "" : actionTarget.dataset.target;
          render();
        }
        if (action === "select-country") {
          const target = actionTarget.dataset.target;
          if (target === "residence") state.residenceCountry = actionTarget.dataset.country;
          if (target === "billing") state.billingCountry = actionTarget.dataset.country;
          state.openCountryMenu = "";
          render();
        }
        if (action === "show-promo") updateState({ promoOpen: true, promoStatus: "" });
        if (action === "apply-promo") {
          const code = state.promoCode.trim().toUpperCase();
          if (code === "SCMPDISCOUNT50") {
            updateState({
              promoCode: code,
              promoStatus: "applied",
              promoOpen: true,
              promoPlanLoading: true,
              promoDiscountApplied: false,
              planExpanded: false,
            });
            setTimeout(() => {
              if (state.promoStatus === "applied" && state.promoPlanLoading) {
                updateState({ promoPlanLoading: false, promoDiscountApplied: true });
              }
            }, CHECKOUT_LOADING_DELAY);
          } else {
            updateState({ promoCode: code, promoStatus: "error", promoOpen: true });
          }
        }
        if (action === "remove-promo") updateState({ promoOpen: false, promoCode: "", promoStatus: "", promoPlanLoading: false, promoDiscountApplied: false });
        if (action === "choose-credit") {
          state.paymentProvider = "credit";
          setScreen("creditLoading", { terms: false, appleTerms: false });
          setTimeout(() => setScreen("credit"), CHECKOUT_LOADING_DELAY);
        }
        if (action === "choose-alipay") {
          state.paymentProvider = "alipay";
          setScreen("creditLoading", { terms: false, appleTerms: false });
          setTimeout(() => setScreen("credit"), CHECKOUT_LOADING_DELAY);
        }
        if (action === "choose-apple") {
          state.paymentProvider = "apple";
          setScreen("appleLoading", { terms: false, appleTerms: false });
          setTimeout(() => setScreen("apple"), CHECKOUT_LOADING_DELAY);
        }
        if (action === "saved-card") setScreen("credit", { addNewCard: false, cardComplete: false });
        if (action === "add-card") setScreen("credit", { addNewCard: true, cardComplete: false });
        if (action === "pay") {
          setScreen("paymentLoading");
          setTimeout(() => {
            if (state.screen === "paymentLoading") setScreen("success");
          }, CHECKOUT_LOADING_DELAY);
        }
        if (action === "start-reading" || action === "reset-flow") {
          setScreen("account", {
            email: "",
            invalidEmail: false,
            password: "",
            passwordVisible: false,
            socialProvider: "",
            paymentProvider: "",
            addNewCard: false,
            cardComplete: false,
            residenceCountry: "Hong Kong SAR",
            billingSameCountry: true,
            billingCountry: "",
            openCountryMenu: "",
            planExpanded: false,
            initialPlanLoading: false,
            promoPlanLoading: false,
            promoDiscountApplied: false,
            promoOpen: false,
            promoCode: "",
            promoStatus: "",
            terms: false,
            appleTerms: false,
          });
        }
      });

      render();
    </script>
  </body>
</html>
